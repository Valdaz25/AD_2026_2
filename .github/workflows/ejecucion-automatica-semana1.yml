name: Ejecutar Semana 1

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ejecutar-semana-1-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: paso 1 Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: paso 2 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: paso 3 Crear entorno virtual
        run: python -m venv .venv

      - name: paso 4 Instalar dependencias
        run: |
          source .venv/bin/activate
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyarrow openpyxl

      - name: paso 5 Limpiar datos y reportes generados
        run: |
          mkdir -p src/sincronicas/datos src/sincronicas/reportes
          find src/sincronicas/datos -mindepth 1 -delete
          find src/sincronicas/reportes -mindepth 1 -delete

      - name: paso 6 Ejecutar Semana_1SINC.ipynb
        working-directory: src/sincronicas
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            Semana_1SINC.ipynb

      - name: paso 7 Confirmar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sincronicas/datos src/sincronicas/reportes src/sincronicas/Semana_1SINC.ipynb

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: Cargo analitica de datos Semana 1 [skip ci]"
          git push origin HEAD:main
